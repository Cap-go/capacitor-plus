name: Build and publish

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "*"

jobs:
  # Tests already passed before tag was created, so just build and deploy
  deploy:
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: "Build and publish to npm"
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: extract
        run: |
          TAG=${{ github.ref_name }}
          VERSION=$TAG
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: |
          npm run build --workspace=core
          npm run build --workspace=cli

      - name: Generate AI changelog
        id: changelog
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run changelog:ai
      - name: Publish all packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=${{ steps.extract.outputs.version }}

          # Determine if this is a prerelease
          if [[ "$VERSION" == *"-"* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi

          echo "Publishing with tag: $NPM_TAG"

          # Publish each package
          for pkg in core cli android ios; do
            echo "Publishing @capacitor-plus/$pkg@$VERSION"
            cd $pkg
            npm publish --tag $NPM_TAG --provenance --access public
            cd ..
          done

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## Capacitor+ v${{ steps.extract.outputs.version }}

            ${{ steps.changelog.outputs.result || '_Changelog was not generated automatically for this release._' }}

            ---

            ### Installation

            ```bash
            npm install @capacitor-plus/core@${{ steps.extract.outputs.version }}
            npm install @capacitor-plus/cli@${{ steps.extract.outputs.version }}
            npm install @capacitor-plus/android@${{ steps.extract.outputs.version }}
            npm install @capacitor-plus/ios@${{ steps.extract.outputs.version }}
            ```

            ### What is Capacitor+?

            Capacitor+ is an automated fork of Capacitor that:
            - Syncs daily with upstream Capacitor
            - Runs full CI/CD on all changes
            - Auto-publishes verified releases

            ---

            Full Changelog: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.from_tag || github.ref_name }}...${{ steps.changelog.outputs.to_tag || github.ref_name }}
          make_latest: true
          token: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'
          prerelease: ${{ contains(github.ref, '-') }}
