name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - 'synchronize'
      - 'opened'
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get Latest
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
  lint:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: brew install swiftlint
      - run: bun run lint
  test-cli:
    runs-on: macos-15
    timeout-minutes: 10
    needs:
      - setup
      - lint
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: bun run build
        working-directory: ./cli
      - run: bun run test
        working-directory: ./cli
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - setup
      - lint
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: bun run build
        working-directory: ./core
      - run: bun run test
        working-directory: ./core
  test-ios:
    runs-on: macos-15
    timeout-minutes: 10
    needs:
      - setup
      - lint
    strategy:
      matrix:
        xcode:
          - /Applications/Xcode_26.0.app
    steps:
      - run: sudo xcode-select --switch ${{ matrix.xcode }}
      - run: xcrun simctl list > /dev/null
      - run: xcodebuild -downloadPlatform iOS
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: bun run verify
        working-directory: ./ios
      - name: Validate native podspec
        run: sh ./scripts/native-podspec.sh lint
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - setup
      - lint
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: bun run verify
        working-directory: ./android
