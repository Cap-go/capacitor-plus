name: Build source code and test it

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [main, plus]
  workflow_call:

jobs:
  guard_swiftpm_version:
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          TEMPLATE_PACKAGE_SWIFT="ios-spm-template/App/CapApp-SPM/Package.swift"
          if ! grep -Eq 'https://github.com/ionic-team/capacitor-swift-pm\.git"[[:space:]]*,[[:space:]]*from:[[:space:]]*"8\.0\.0"' "$TEMPLATE_PACKAGE_SWIFT"; then
            echo "Expected capacitor-swift-pm to be pinned to 8.0.0 in $TEMPLATE_PACKAGE_SWIFT"
            exit 1
          fi
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get Latest
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
  lint:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: brew install swiftlint
      - run: bun run lint
  test-cli:
    runs-on: macos-15
    timeout-minutes: 30
    needs:
      - setup
      - lint
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: bun run build
        working-directory: ./cli
      - run: bun run test
        working-directory: ./cli
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - setup
      - lint
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: bun run build
        working-directory: ./core
      - run: bun run test
        working-directory: ./core
  test-ios:
    runs-on: macos-15
    timeout-minutes: 30
    needs:
      - setup
      - lint
    strategy:
      matrix:
        xcode:
          - /Applications/Xcode_26.0.app
    steps:
      - run: sudo xcode-select --switch ${{ matrix.xcode }}
      - run: xcrun simctl list > /dev/null
      - run: xcodebuild -downloadPlatform iOS
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v6
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: bun run verify
        working-directory: ./ios
      - name: Validate native podspec
        run: sh ./scripts/native-podspec.sh lint
  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - setup
      - lint
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: actions/checkout@v6
      - name: Restore Dependency Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.OS }}-bun-dependencies-cache-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --linker=hoisted
      - run: bun run verify
        working-directory: ./android
